function compressImageToBase64(file: File, maxWidth = 900, quality = 0.78): Promise<string> {
  return new Promise((resolve, reject) => {
    const reader = new FileReader()
    reader.onerror = () => reject(reader.error)
    reader.onload = () => {
      const img = new Image()
      img.onerror = () => reject(new Error('Imagem inválida'))
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width)
        const canvas = document.createElement('canvas')
        canvas.width = Math.round(img.width * scale)
        canvas.height = Math.round(img.height * scale)
        const ctx = canvas.getContext('2d')
        if (!ctx) return reject(new Error('Canvas indisponível'))
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height)
        resolve(canvas.toDataURL('image/webp', quality))
      }
      img.src = reader.result as string
    }
    reader.readAsDataURL(file)
  })
}

const SPEED = 0.8

function ImageMarquee() {
  const { studio, swap } = useContext(MediaCtx)
  const trackRef = useRef<HTMLDivElement>(null)
  const offset = useRef(0)
  const velocity = useRef(0)
  const dragging = useRef(false)
  const dragStartX = useRef(0)
  const dragStartOffset = useRef(0)
  const lastX = useRef(0)
  const lastT = useRef(0)
  const [grabbing, setGrabbing] = useState(false)

  useEffect(() => {
    let raf = 0
    const tick = () => {
      const track = trackRef.current
      if (track) {
        if (!dragging.current) {
          if (Math.abs(velocity.current) > 0.1) {
            offset.current += velocity.current
            velocity.current *= 0.95
          } else {
            velocity.current = 0
            offset.current -= SPEED
          }
        }
        const halfWidth = track.scrollWidth / 2
        if (offset.current <= -halfWidth) offset.current += halfWidth
        if (offset.current > 0) offset.current -= halfWidth
        track.style.transform = `translate3d(${offset.current}px, 0, 0)`
      }
      raf = requestAnimationFrame(tick)
    }
    raf = requestAnimationFrame(tick)
    return () => cancelAnimationFrame(raf)
  }, [])

  const onPointerDown = (e: React.PointerEvent<HTMLDivElement>) => {
    dragging.current = true
    velocity.current = 0
    e.currentTarget.setPointerCapture(e.pointerId)
    dragStartX.current = e.clientX
    dragStartOffset.current = offset.current
    lastX.current = e.clientX
    lastT.current = performance.now()
    setGrabbing(true)
  }
  const onPointerMove = (e: React.PointerEvent<HTMLDivElement>) => {
    if (!dragging.current) return
    const now = performance.now()
    const dt = Math.max(now - lastT.current, 1)
    velocity.current = ((e.clientX - lastX.current) / dt) * 16
    offset.current = dragStartOffset.current + (e.clientX - dragStartX.current)
    lastX.current = e.clientX
    lastT.current = now
  }
  const endDrag = () => {
    dragging.current = false
    setGrabbing(false)
  }
  const onPointerUp = (e: React.PointerEvent<HTMLDivElement>) => {
    const moved = Math.abs(e.clientX - dragStartX.current)
    endDrag()
    if (studio && moved < 5) {
      const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-slot]')
      const k = el?.getAttribute('data-slot') as Key | null
      if (k) swap(k)
    }
  }

  return (
    <section className="relative py-4 overflow-hidden">
      <div className="pointer-events-none absolute top-0 left-0 right-0 h-[80px] sm:h-[100px] z-10">
        <svg viewBox="0 0 1440 100" preserveAspectRatio="none" className="w-full h-full">
          <path d="M0 0H1440V50C1440 50 1200 100 720 100C240 100 0 50 0 50V0Z" fill="white" />
        </svg>
      </div>
      <div
        ref={trackRef}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={endDrag}
        style={{ willChange: 'transform', touchAction: 'pan-y' }}
        className={`flex w-max gap-3 sm:gap-4 py-4 select-none ${grabbing ? 'cursor-grabbing' : 'cursor-grab'}`}
      >
        {[...SLIDES, ...SLIDES].map((s, i) => (
          <Photo key={i} k={s.key} alt={s.label} clickable={false} className="w-64 h-80 sm:w-80 sm:h-[30rem] flex-shrink-0 rounded-2xl group">
            <div className="absolute bottom-3 left-3 max-w-[calc(100%-1.5rem)] flex items-center gap-2 bg-white/90 backdrop-blur-md px-3.5 py-1.5 rounded-full text-xs font-medium text-neutral-900 shadow-sm pointer-events-none">
              <span className="w-1.5 h-1.5 rounded-full bg-[#B8860B] flex-shrink-0" />
              <span className="truncate">{s.label}</span>
            </div>
          </Photo>
        ))}
      </div>
      <div className="pointer-events-none absolute bottom-0 left-0 right-0 h-[80px] sm:h-[100px] z-10">
        <svg viewBox="0 0 1440 100" preserveAspectRatio="none" className="w-full h-full">
          <path d="M0 100H1440V50C1440 50 1200 0 720 0C240 0 0 50 0 50V100Z" fill="white" />
        </svg>
      </div>
    </section>
  )
}

const EASE_OUT = 'cubic-bezier(0.16,1,0.3,1)'

/** Scroll reveal: fade + translate up, calm easing, no springs. Honors prefers-reduced-motion. */
function Reveal({ children, delay = 0, y = 40, className = '' }: { children: React.ReactNode; delay?: number; y?: number; className?: string }) {
  const ref = useRef<HTMLDivElement>(null)
  const [shown, setShown] = useState(false)
  useEffect(() => {
    const el = ref.current
    if (!el) return
    if (typeof IntersectionObserver === 'undefined' || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setShown(true)
      return
    }
    const io = new IntersectionObserver(
      ([en]) => {
        if (en.isIntersecting || en.boundingClientRect.top < 0) {
          setShown(true)
          io.disconnect()
        }
      },
      { threshold: 0.12, rootMargin: '0px 0px -6% 0px' }
    )
    io.observe(el)
    return () => io.disconnect()
  }, [])
  return (
    <div
      ref={ref}
      className={className}
      style={{
        opacity: shown ? 1 : 0,
        transform: shown ? 'none' : `translate3d(0, ${y}px, 0)`,
        transition: `opacity 1000ms ${EASE_OUT} ${delay}ms, transform 1100ms ${EASE_OUT} ${delay}ms`,
        willChange: shown ? 'auto' : 'opacity, transform',
      }}
    >
      {children}
    </div>
  )
}

function BeforeAfter({ before, after, caso }: { before: Key; after: Key; caso: string }) {
  const { media, studio, swap } = useContext(MediaCtx)
  const box = useRef<HTMLDivElement>(null)
  const dragging = useRef(false)
  const [pos, setPos] = useState(90) // posição da linha em %; o "depois" aparece à direita dela
  const move = (x: number) => {
    const r = box.current?.getBoundingClientRect()
    if (r) setPos(Math.min(100, Math.max(0, ((x - r.left) / r.width) * 100)))
  }
  const img = (k: Key, extra?: React.CSSProperties) => (
    <img
      src={media[k] || FALLBACK[k]}
      alt=""
      draggable={false}
      style={extra}
      className="absolute inset-0 w-full h-full object-cover pointer-events-none"
      onError={(e) => { if (e.currentTarget.src !== FALLBACK[k]) e.currentTarget.src = FALLBACK[k] }}
    />
  )
  const pill = 'absolute top-3 bg-white/90 backdrop-blur-md text-[11px] font-semibold tracking-[0.2em] uppercase text-neutral-900 rounded-full px-3 py-1 shadow-sm pointer-events-none'
  const btn = 'absolute bottom-3 text-[11px] font-medium bg-neutral-900/85 text-white rounded-full px-3 py-1.5 hover:bg-[#9A7B2C] transition-colors'
  return (
    <figure>
      <div
        ref={box}
        role="slider"
        tabIndex={0}
        aria-label={`Comparar antes e depois – ${caso}`}
        aria-valuemin={0}
        aria-valuemax={100}
        aria-valuenow={Math.round(pos)}
        onKeyDown={(e) => {
          if (e.key === 'ArrowLeft') setPos((p) => Math.max(0, p - 5))
          if (e.key === 'ArrowRight') setPos((p) => Math.min(100, p + 5))
        }}
        onPointerDown={(e) => { dragging.current = true; e.currentTarget.setPointerCapture(e.pointerId); move(e.clientX) }}
        onPointerMove={(e) => { if (dragging.current) move(e.clientX) }}
        onPointerUp={() => { dragging.current = false }}
        onPointerCancel={() => { dragging.current = false }}
        style={{ touchAction: 'pan-y' }}
        className="relative aspect-[4/5] overflow-hidden rounded-2xl bg-neutral-100 cursor-ew-resize select-none outline-none focus-visible:ring-2 focus-visible:ring-[#B8860B]"
      >
        {img(before)}
        {img(after, { clipPath: `inset(0 0 0 ${pos}%)` })}
        <span className={`${pill} left-3`}>Antes</span>
        <span className={`${pill} right-3`}>Depois</span>
        <div className="absolute top-0 bottom-0 w-0.5 bg-white shadow-[0_0_8px_rgba(0,0,0,0.35)] pointer-events-none" style={{ left: `${pos}%`, transform: 'translateX(-50%)' }}>
          <span className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white border-2 border-[#B8860B] shadow-md flex items-center justify-center text-[#9A7B2C] text-sm font-semibold">
            ‹ ›
          </span>

        {studio && (
          <>
            <button onPointerDown={(e) => e.stopPropagation()} onClick={() => swap(before)} className={`${btn} left-3`}>📸 Trocar antes</button>
            <button onPointerDown={(e) => e.stopPropagation()} onClick={() => swap(after)} className={`${btn} right-3`}>📸 Trocar depois</button>
          </>
        )}
      </div>
      <figcaption className="mt-3 text-xs font-semibold tracking-[0.2em] uppercase text-neutral-500">{caso}</figcaption>
    </figure>
  )
}

function App() {
  const [overrides, setOverrides] = useState<Partial<MediaMap>>(() => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') } catch { return {} }
  })
  const [hidden, setHidden] = useState(() => {
    try { return localStorage.getItem(HIDE_KEY) === '1' } catch { return false }
  })
  const [modal, setModal] = useState(false)
  const [msg, setMsg] = useState('')
  const fileRef = useRef<HTMLInputElement>(null)
  const batchRef = useRef<HTMLInputElement>(null)
  const target = useRef<Key>('ambiente1')

  const media = useMemo(
    () => ({ ...FALLBACK, ...(EMBEDDED_MEDIA as Partial<MediaMap>), ...overrides }) as MediaMap,
    [overrides]
  )

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides)) } catch { setMsg('Armazenamento local cheio: copie o código embutido.') }
  }, [overrides])
  useEffect(() => {
    try { localStorage.setItem(HIDE_KEY, hidden ? '1' : '0') } catch { /* ignore */ }
  }, [hidden])
  useEffect(() => {
    // Ctrl+Shift+E brings the Studio button back after hiding it
    const f = (e: KeyboardEvent) => { if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'e') setHidden((h) => !h) }
    window.addEventListener('keydown', f)
    return () => window.removeEventListener('keydown', f)
  }, [])

  const swap = (k: Key) => { target.current = k; fileRef.current?.click() }

  const onSingle = async (e: React.ChangeEvent<HTMLInputElement>) => {
    const f = e.target.files?.[0]
    e.target.value = ''
    if (!f) return
    try {
      const data = await compressImageToBase64(f, target.current === 'logo' ? 400 : 900)
      setOverrides((o) => ({ ...o, [target.current]: data }))
    } catch { setMsg('Não foi possível ler essa imagem.') }
  }

  const onBatch = async (e: React.ChangeEvent<HTMLInputElement>) => {
    const files = Array.from(e.target.files || []).slice(0, 7)
    e.target.value = ''
    try {
      const out = await Promise.all(files.map((f) => compressImageToBase64(f)))
      const next: Partial<MediaMap> = {}
      out.forEach((d, i) => { next[`ambiente${i + 1}` as Key] = d })
      setOverrides((o) => ({ ...o, ...next }))
      setMsg(`${out.length} foto(s) aplicadas em ambiente1–${out.length}.`)
    } catch { setMsg('Falha ao processar as fotos.') }
  }

  const copyCode = async () => {
    const data = Object.fromEntries(Object.entries(media).filter(([k, v]) => SLOTS.some((x) => x.key === k) && v.startsWith('data:')))
    const code = `const EMBEDDED_MEDIA = ${JSON.stringify(data, null, 2)}`
    try { await navigator.clipboard.writeText(code); setMsg('Código copiado!') } catch { setMsg('Não foi possível copiar automaticamente.') }
  }

  const studio = !hidden

  return (
    <MediaCtx.Provider value={{ media, studio, swap }}>
      <div className="min-h-screen bg-white text-neutral-900 overflow-x-hidden selection:bg-[#B8860B]/20">
        <Navbar />
        <HeroContent />
        <ImageMarquee />
        <HeroBottom />
        <About />
        <Specialties />
        <BeforeAfterSection />
        <Booking />
        <Footer />

        <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onSingle} />
        <input ref={batchRef} type="file" accept="image/*" multiple className="hidden" onChange={onBatch} />

        {studio && (
          <button
            onClick={() => setModal(true)}
            className="fixed bottom-5 right-5 z-[80] bg-neutral-900 text-white text-sm font-medium rounded-full px-5 py-3 shadow-lg hover:bg-[#9A7B2C] transition-colors"
          >
            📸 Inserir Fotos no Site
          </button>
        )}

        {studio && modal && (
          <div className="fixed inset-0 z-[90] flex justify-end bg-black/50 backdrop-blur-sm" onClick={() => setModal(false)}>
            <div className="w-full max-w-md h-full bg-white overflow-y-auto p-5 sm:p-6" onClick={(e) => e.stopPropagation()}>
              <div className="flex items-center justify-between">
                <h2 className="text-lg font-semibold">📸 Inserir Fotos (Sem Pastas)</h2>
                <button onClick={() => setModal(false)} aria-label="Fechar" className="w-9 h-9 rounded-full hover:bg-neutral-100 text-xl leading-none">×</button>
              </div>
              <p className="mt-2 text-sm text-neutral-600">Escolha uma foto por espaço, ou envie várias de uma vez. As imagens são comprimidas e salvas neste navegador.</p>

              <button onClick={() => batchRef.current?.click()} className="mt-4 w-full bg-[#B8860B] hover:bg-[#9A7B2C] text-white rounded-full px-5 py-3 text-sm font-medium transition-colors">
                Selecionar Várias Fotos de Uma Vez (Upload em Lote)
              </button>

              <ul className="mt-5 divide-y divide-neutral-100">
                {SLOTS.map((s) => (
                  <li key={s.key} className="flex items-center gap-3 py-2.5">
                    <div className={`w-14 h-14 bg-neutral-100 overflow-hidden flex-shrink-0 ${s.key === 'logo' ? 'rounded-full' : 'rounded-md'}`}>
                      {(media[s.key] || FALLBACK[s.key]) && <img src={media[s.key] || FALLBACK[s.key]} alt="" className="w-full h-full object-cover" />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-medium truncate">{s.label}</p>
                      <p className="text-xs text-neutral-500">{s.key}</p>
                    </div>
                    <button onClick={() => swap(s.key)} className="text-xs font-medium border border-neutral-300 rounded-full px-3 py-1.5 hover:border-neutral-900">Trocar</button>
                  </li>
                ))}
              </ul>

              <div className="mt-5 grid gap-2.5">
                <button onClick={copyCode} className="bg-neutral-900 hover:bg-[#9A7B2C] text-white rounded-full px-5 py-3 text-sm font-medium transition-colors">
                  📋 Copiar Código com Fotos Embutidas
                </button>
                <button onClick={() => { setHidden(true); setModal(false) }} className="border border-neutral-300 hover:border-neutral-900 rounded-full px-5 py-3 text-sm font-medium transition-colors">
                  ✨ Ocultar Botão de Edição
                </button>
                {msg && <p className="text-xs text-[#9A7B2C] text-center">{msg}</p>}
                <p className="text-[11px] text-neutral-400 text-center">Para reexibir o botão: Ctrl + Shift + E</p>
              </div>
            </div>
          </div>
        )}
      </div>
    </MediaCtx.Provider>
  )
}
